name: Build and Deploy Documentation

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ rebuild-docs ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Docs Hub
        uses: actions/checkout@v4
        with:
          path: hub
          
      - name: Checkout Central Branding Assets
        uses: actions/checkout@v4
        with:
          repository: Trickle-Charge/.github
          path: assets-temp
          sparse-checkout: |
            assets

      - name: Copy Branding Assets into Docs
        run: |
          mkdir -p hub/docs/assets
          cp -r assets-temp/assets/. hub/docs/assets/
          rm -rf assets-temp

      - name: Checkout Infra Docs
        uses: actions/checkout@v4
        with:
          repository: Trickle-Charge/TrickleCharge-Infra
          path: infra-temp
          sparse-checkout: |
            docs

      - name: Copy Infra Docs into Hub Root
        run: |
          mkdir -p hub/docs/infra
          cp -r infra-temp/docs/. hub/docs/infra/
          rm -rf infra-temp

      - name: Checkout Unity Packages Docs
        uses: actions/checkout@v4
        with:
          repository: Trickle-Charge/packages-unity
          path: hub/docs/packages-unity
          
      - name: Checkout DingOS Docs
        uses: actions/checkout@v4
        with:
          repository: Trickle-Charge/DingOS
          path: hub/docs/dingos

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Build and Deploy to GitHub Pages
        run: |
          cd hub
          mkdocs gh-deploy --force