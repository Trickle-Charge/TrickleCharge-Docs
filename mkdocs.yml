site_name: TrickleCharge Documentation
site_description: Centralized documentation portal for TrickleCharge packages and infrastructure.
site_url: https://docs.tricklecharge.dev/

theme:
  name: material
  favicon: assets/favicon/favicon.ico
  logo: assets/branding/logo.svg
  palette:
    scheme: slate # Dark mode
    primary: custom
    accent: custom
  features:
    - navigation.indexes
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/style/brand-vars.css
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition

nav:
  - Home: README.md
  - Infrastructure:
      - Overview: infra/README.md
      - Package Registry: infra/registry/verdaccio.md
      - CI/CD Pipelines: infra/cicd/README.md
  - DingOS:
      - Overview: dingos/Documentation~/index.md
      - Custom Implementations: dingos/Documentation~/custom-implementations.md
      - Script Reference: dingos/Documentation~/ScriptReference/index.md
  - Unity Packages:
      - Overview: packages-unity/README.md
      - Core Art:
          - Overview: packages-unity/Packages/com.tricklecharge.unity.art.core/Documentation~/index.md
          - Script Reference: packages-unity/Packages/com.tricklecharge.unity.art.core/Documentation~/ScriptReference/index.md
      - Dev Art:
          - Overview: packages-unity/Packages/com.tricklecharge.unity.art.devart/Documentation~/index.md
          - Script Reference: packages-unity/Packages/com.tricklecharge.unity.art.devart/Documentation~/ScriptReference/index.md
      - Attributes:
          - Overview: packages-unity/Packages/com.tricklecharge.unity.attributes/Documentation~/index.md
          - Script Reference: packages-unity/Packages/com.tricklecharge.unity.attributes/Documentation~/ScriptReference/index.md
      - DingOS:
          - Overview: packages-unity/Packages/com.tricklecharge.unity.dingos/Documentation~/index.md
          - Script Reference: packages-unity/Packages/com.tricklecharge.unity.dingos/Documentation~/ScriptReference/index.md
      - Drone:
          - Overview: packages-unity/Packages/com.tricklecharge.unity.drone/Documentation~/index.md
          - Script Reference: packages-unity/Packages/com.tricklecharge.unity.drone/Documentation~/ScriptReference/index.md
      - Math:
          - Overview: packages-unity/Packages/com.tricklecharge.unity.math/Documentation~/index.md
          - Script Reference: packages-unity/Packages/com.tricklecharge.unity.math/Documentation~/ScriptReference/index.md
      - Physics:
          - Overview: packages-unity/Packages/com.tricklecharge.unity.physics/Documentation~/index.md
          - Script Reference: packages-unity/Packages/com.tricklecharge.unity.physics/Documentation~/ScriptReference/index.md
      - Vehicles:
          - Overview: packages-unity/Packages/com.tricklecharge.unity.vehicles/Documentation~/index.md
          - Script Reference: packages-unity/Packages/com.tricklecharge.unity.vehicles/Documentation~/ScriptReference/index.md